<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="GRABNGO zakelijk bestelportaal van Mobile Express B.V. Bestel eenvoudig GRABNGO-producten voor uw winkel of locatie.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GRABNGO">
<title>GRABNGO — Zakelijk bestellen</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icons/icon-180.png">
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<div id="app">
  <main id="view" role="main">
    <div id="boot" style="padding:80px 20px;text-align:center">
      <div class="spinner"></div>
      <p style="color:#6b6b73;font-size:13px;margin-top:12px">GRABNGO wordt geladen…</p>
    </div>
  </main>
  <nav id="bottomnav" class="bottomnav" aria-label="Hoofdnavigatie" hidden></nav>
</div>
<noscript><div style="padding:24px;font-family:sans-serif">Zet JavaScript aan om de GRABNGO-app te gebruiken.</div></noscript>
<script type="module" src="/app/js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/app/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
